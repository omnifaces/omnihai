# NOTE: the Sonar analysis requires the SONAR_TOKEN secret and requires Automatic Analysis to be switched off in the
# SonarCloud project settings, as SonarCloud refuses a CI analysis while Automatic Analysis is enabled.

name: main

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  build:
    # The library is built for the oldest Java it supports and run on every newer one its users may run it on.
    name: Build on JDK ${{matrix.java}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # One Java failing may not hide whether the others pass.
      matrix:
        java: [ '17', '21', '25' ]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
    - name: Set up JDK ${{matrix.java}}
      uses: actions/setup-java@v5
      with:
        java-version: ${{matrix.java}}
        distribution: 'temurin'
        cache: maven
    - name: Cache Sonar packages
      if: matrix.java == '17'
      uses: actions/cache@v6
      with:
        path: ~/.sonar/cache
        key: ${{runner.os}}-sonar
        restore-keys: ${{runner.os}}-sonar
    - name: Build and test
      if: matrix.java != '17'
      run: mvn -B -ntp clean verify # The integration tests are skipped by default as they require an API key of each AI provider.
    # Analyzing takes the build it analyzes, so it runs the tests once rather than after a job which already ran them.
    - name: Build, test and analyze with Sonar
      if: matrix.java == '17'
      run: mvn -B -ntp clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar -Dsonar.projectKey=omnifaces_omnihai
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        SONAR_TOKEN: ${{secrets.SONAR_TOKEN}}
