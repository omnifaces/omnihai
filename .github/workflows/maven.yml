# NOTE: the Sonar analysis requires the SONAR_TOKEN secret and requires Automatic Analysis to be switched off in the
# SonarCloud project settings, as SonarCloud refuses a CI analysis while Automatic Analysis is enabled.

name: main

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Test with Maven
      run: mvn -B clean verify # The integration tests are skipped by default as they require an API key of each AI provider.

  analyze:
    name: Analyze with Sonar
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Cache Sonar packages
      uses: actions/cache@v6
      with:
        path: ~/.sonar/cache
        key: ${{runner.os}}-sonar
        restore-keys: ${{runner.os}}-sonar
    - name: Cache Maven packages
      uses: actions/cache@v6
      with:
        path: ~/.m2
        key: ${{runner.os}}-m2-${{hashFiles('**/pom.xml')}}
        restore-keys: ${{runner.os}}-m2
    - name: Build and analyze
      run: mvn -B clean package org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar -Dsonar.projectKey=omnifaces_omnihai -Dmaven.javadoc.skip=true
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        SONAR_TOKEN: ${{secrets.SONAR_TOKEN}}
